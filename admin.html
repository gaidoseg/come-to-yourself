<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Emilie Gaidos Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --brown-deep:#3A2A1E; --brown:#6B4A34; --brown-soft:#9C7A5C;
    --beige:#F4ECDD; --white:#FFFFFF; --ok:#3a7a4a; --warn:#a33;
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--beige); color:var(--brown-deep);
    font-family:'Jost',sans-serif; font-weight:300; padding:32px 20px;
  }
  h1{ font-family:'Lora',serif; font-weight:500; font-size:24px; margin:0 0 20px 0; }
  .card{ max-width:420px; margin:80px auto; background:var(--white); padding:32px; border-radius:4px; }
  input{ width:100%; padding:10px 12px; font-size:15px; border:1px solid var(--brown-soft); border-radius:3px; margin-bottom:12px; font-family:inherit; }
  button{ background:var(--brown-deep); color:var(--white); border:none; padding:10px 18px; border-radius:3px; cursor:pointer; font-family:inherit; font-size:14px; }
  button:disabled{ opacity:0.6; cursor:default; }
  table{ width:100%; border-collapse:collapse; background:var(--white); font-size:13px; }
  th, td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--beige); white-space:nowrap; }
  th{ font-weight:500; color:var(--brown-soft); text-transform:uppercase; font-size:11px; letter-spacing:0.05em; }
  .table-wrap{ overflow-x:auto; max-width:1100px; margin:0 auto; }
  .status-paid{ color:var(--ok); }
  .error{ color:var(--warn); font-size:14px; }
  .enroll-btn{ background:none; border:1px solid var(--brown-soft); color:var(--brown-deep); padding:4px 10px; font-size:12px; border-radius:3px; cursor:pointer; }
  .enroll-btn.done{ background:var(--ok); color:var(--white); border-color:var(--ok); }
  a.top-link{ color:var(--brown); font-size:13px; }
</style>
</head>
<body>
  <div id="login" class="card">
    <h1>Admin login</h1>
    <input type="password" id="pw" placeholder="Admin password" autocomplete="off">
    <button id="login-btn" type="button">Log in</button>
    <p id="login-error" class="error" style="display:none;"></p>
  </div>

  <div id="dashboard" style="display:none;">
    <div style="max-width:1100px; margin:0 auto 20px auto; display:flex; justify-content:space-between; align-items:baseline;">
      <h1>Self-Paced Program — Registrations</h1>
      <a href="/" class="top-link">&larr; Back to site</a>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th><th>Email</th><th>Name</th><th>Amount</th><th>Status</th><th>Kajabi enrolled</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="dash-error" class="error" style="display:none; max-width:1100px; margin:16px auto;"></p>
  </div>

  <script>
    var PW_KEY = 'admin_pw';

    function fmtMoney(cents, currency) {
      return (cents / 100).toFixed(2) + ' ' + currency.toUpperCase();
    }
    function fmtDate(iso) {
      return new Date(iso).toLocaleString();
    }

    function loadRegistrations(password) {
      return fetch('/api/admin-registrations', { headers: { 'x-admin-password': password } })
        .then(function (r) {
          if (!r.ok) throw new Error(r.status === 401 ? 'Wrong password.' : 'Failed to load.');
          return r.json();
        });
    }

    function renderRows(registrations, password) {
      var tbody = document.getElementById('rows');
      tbody.innerHTML = '';
      registrations.forEach(function (r) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + fmtDate(r.created_at) + '</td>' +
          '<td>' + (r.email || '') + '</td>' +
          '<td>' + (r.name || '') + '</td>' +
          '<td>' + fmtMoney(r.amount_cents, r.currency) + '</td>' +
          '<td class="status-paid">' + r.payment_status + '</td>' +
          '<td></td>';
        var td = tr.lastElementChild;
        var btn = document.createElement('button');
        btn.className = 'enroll-btn' + (r.kajabi_enrolled ? ' done' : '');
        btn.textContent = r.kajabi_enrolled ? 'Enrolled ✓' : 'Mark enrolled';
        btn.addEventListener('click', function () {
          var next = !r.kajabi_enrolled;
          fetch('/api/admin-registrations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-password': password },
            body: JSON.stringify({ id: r.id, kajabi_enrolled: next })
          }).then(function (resp) {
            if (resp.ok) {
              r.kajabi_enrolled = next;
              btn.className = 'enroll-btn' + (next ? ' done' : '');
              btn.textContent = next ? 'Enrolled ✓' : 'Mark enrolled';
            }
          });
        });
        td.appendChild(btn);
        tbody.appendChild(tr);
      });
    }

    function showDashboard(password) {
      loadRegistrations(password)
        .then(function (data) {
          sessionStorage.setItem(PW_KEY, password);
          document.getElementById('login').style.display = 'none';
          document.getElementById('dashboard').style.display = 'block';
          renderRows(data.registrations, password);
        })
        .catch(function (err) {
          var el = document.getElementById('login-error');
          el.textContent = err.message;
          el.style.display = 'block';
        });
    }

    document.getElementById('login-btn').addEventListener('click', function () {
      showDashboard(document.getElementById('pw').value);
    });
    document.getElementById('pw').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') showDashboard(this.value);
    });

    var saved = sessionStorage.getItem(PW_KEY);
    if (saved) showDashboard(saved);
  </script>
</body>
</html>
